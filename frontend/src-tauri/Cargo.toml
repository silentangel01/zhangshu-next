[package]
name = "zhangshu-desktop"
version = "0.1.0"
description = "章枢 - 本地优先的网络小说写作应用"
authors = ["Zhangshu Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
