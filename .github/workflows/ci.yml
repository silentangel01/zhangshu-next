# 章枢 CI/CD
#
# push dev  → 跑测试 → 通过后自动合并到 main
# push main → 跑测试（验证合并后的代码）
#
# 用户只需 push dev，其余全自动。发 release 仍手动打 tag。

name: CI

on:
  push:
    branches: [dev, main]

# 同一分支的新 push 取消旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 前端测试 ──────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── 后端测试 ──────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Import check
        working-directory: backend
        run: python -c "from app.main import app; print('ok')"

      - name: Tests
        working-directory: backend
        run: python -m pytest tests/ -q

  # ── 云服务端测试 ──────────────────────────────────────────────────
  cloud-server:
    name: Cloud Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud-server/requirements.txt

      - name: Install
        working-directory: cloud-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Import check
        working-directory: cloud-server
        run: python -c "from app.main import app; print(app.title)"

      - name: Tests
        working-directory: cloud-server
        run: python -m pytest tests/ -q

  # ── 自动合并 dev → main ──────────────────────────────────────────
  auto-merge:
    name: Auto-merge dev → main
    needs: [frontend, backend, cloud-server]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge dev into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge origin/dev --no-edit -m "chore: auto-merge dev → main [skip ci]"
          git push origin main
