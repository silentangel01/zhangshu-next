services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhangshu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhangshu}
      POSTGRES_DB: ${POSTGRES_DB:-zhangshu_cloud}
    ports:
      - "127.0.0.1:5432:5432"  # 仅本机可访问
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhangshu} -d ${POSTGRES_DB:-zhangshu_cloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  cloud-api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"  # 仅本机可访问 (Nginx 反代)
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 9000 --workers 2"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_data:
