# Nginx configuration for Zhangshu Cloud Admin panel
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
#
# Prerequisites:
#   1. Build the admin frontend: cd cloud-admin && npm run build
#   2. Upload dist/ contents to /var/www/cloud-admin/
#   3. Ensure the cloud-server API is running (proxy_pass target)
#
# IMPORTANT: Rate limit zones must be defined in the http {} block.
# Create /etc/nginx/conf.d/rate-limits.conf with the zone definitions
# (see the rate-limits.conf snippet below).

# ── Rate limit zone definitions ────────────────────────────────────────
# Place the following in /etc/nginx/conf.d/rate-limits.conf:
#
#   limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=api_admin:10m rate=60r/m;
#   limit_req_zone $binary_remote_addr zone=api_feedback:10m rate=20r/m;
#
# Rate limits are the FIRST layer of protection.  Application-level
# Redis rate limits provide the SECOND layer.  Both must be active.

server {
    listen 80;
    server_name admin.example.com;  # Replace with your domain

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;  # Replace with your domain

    # ── SSL ──────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Request body limit ───────────────────────────────────────────────
    # API JSON and small forms only — backup uploads go through OSS presigned URLs.
    client_max_body_size 10M;

    # ── Static files ─────────────────────────────────────────────────────
    root /var/www/cloud-admin;
    index index.html;

    # Immutable cache for hashed assets (Vite output)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy — auth endpoints (strict rate limit) ───────────────────
    location /api/auth/login {
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/auth/register {
        limit_req zone=api_auth burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── API proxy — admin endpoints ──────────────────────────────────────
    location /api/admin/ {
        limit_req zone=api_admin burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── API proxy — feedback endpoints ───────────────────────────────────
    location /api/feedback {
        limit_req zone=api_feedback burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── API proxy — general endpoints ────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── Health check proxy ───────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /ready {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ── Logging ──────────────────────────────────────────────────────────
    access_log /var/log/nginx/cloud-admin-access.log;
    error_log  /var/log/nginx/cloud-admin-error.log;
}
