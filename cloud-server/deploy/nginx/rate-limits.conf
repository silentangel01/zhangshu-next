# Nginx rate limit zone definitions
# Place in /etc/nginx/conf.d/rate-limits.conf
#
# These zones define the FIRST layer of rate limiting (Nginx level).
# Application-level Redis rate limits provide the SECOND layer.
# Both must be active for defense-in-depth.
#
# Zones:
#   api_general  — default for all /api/ routes (10 requests/second per IP)
#   api_auth     — login/register (5 requests/minute per IP)
#   api_admin    — admin panel (60 requests/minute per IP)
#   api_feedback — feedback submission (20 requests/minute per IP)

limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_admin:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_feedback:10m rate=20r/m;

# Return 429 instead of default 503 for rate-limited requests
limit_req_status 429;

# Log rate-limited requests for monitoring
limit_req_log_level warn;
